query MyAccess {
  myAccess {
    id
    level
    canAccessDailySessions
    assistantMessagesPerDay
    assistantMessagesUsed
    assistantMessagesRemaining

    trialJourneyId
    trialStatus
    trialStartedAt
    trialExpiredAt

    premiumTotalDays
    premiumConsumedDays
    premiumRemainingDays

    createdAt
    updatedAt
  }
}
