mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    user {
      id
      email
      displayName
      gender
      role
      emailVerified
      isActive
      avatarUrl
      bio
      phone
      dob
      locationName
      locationLat
      locationLong
      timezone
      locale
      createdAt
      updatedAt
      whatBringsYouHere
      howLongHasItBeen
      howAreYouFeeling
      whatWouldYouLikeHelpWith
    }
    updatedFields
  }
}
