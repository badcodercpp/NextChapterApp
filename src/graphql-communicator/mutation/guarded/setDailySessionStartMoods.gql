mutation setDailySessionStartMoods($input: SetDailySessionMoodsInput!) {
  setDailySessionStartMoods(input: $input) {
    id
    userId
    journeyId
    missionId
    questionHistoryId
    reflectionId
    day
    status
    currentStep
    startMoods
    endMoods
    startedAt
    missionCompletedAt
    completedAt
    createdAt
    updatedAt
  }
}
